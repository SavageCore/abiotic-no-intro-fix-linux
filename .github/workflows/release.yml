name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint (shellcheck)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning
      - name: Create zip for Nexus
        run: |
          ver="${GITHUB_REF_NAME#v}"
          zip "abiotic-no-intro-fix-linux-${ver}.zip" no-intro.sh README.md
          ls -lh *.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: abiotic-no-intro-fix-linux-*.zip
